motor_file: motors/aerotech_HP-H115DM.eng       #RASP .eng thrust curve file #DATA GENERATED BY AI TO TEST THE DUAL DEPLOYMENT SYSTEM

rocket:
  structure_mass: 1.2         #kg (Mass excluding motor mass)
  Cd: 0.5
  diameter: 0.076              #m (outer diameter of body tube)

recovery:
  type: dual                  # options: ballistic | single | dual

  ## used when type: single
  #parachute_area: 0.0116        #m^2
  #parachute_Cd: 0.8

  ## used when type: dual
  drogue_area: 0.057             #m^2
  drogue_Cd: 1.5
  main_area: 0.243            #m^2
  main_Cd: 2.2
  main_deploy_altitude: 152    # meters AGL — main chute deploys once descending below this

launch_conditions:
  angle_deg: 5                  #deg (degrees from vertical)
  launch_azimuth_from_east: 45  #launch azimuth angle from eastward direction (degrees)
  wind_speed: 2.0               #m/s (Horizontal wind speed)
  wind_gust_speed: 4.0          #m/s (Peak gust speed of the wind)
  wind_azimuth_from_east: 270   #degrees from east(+x) where the wind is pointing

simulation:
  dt: 0.01                      #s (Euler integration step in time)